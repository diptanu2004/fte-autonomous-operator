# Guardrails enforced in code by fte/policy.py — the model cannot talk its way past them.
#
# decision: "approve" -> pause and ask a human; "block" -> refuse outright.

browser:
  # Only these origins may be navigated to.
  allowed_origins:
    - http://127.0.0.1:5055
    - http://localhost:5055

  # Rules evaluated when the agent clicks something. All present conditions must hold.
  click_rules:
    # Procedural precondition: the operator must have looked at the evidence before acting on it.
    # {po_number} is filled from the form being submitted; the URL must have been visited this run.
    - name: po-must-be-reviewed
      decision: block
      label_regex: "(?i)save invoice"
      requires_visited: "/purchase-orders/{po_number}"
      reason: >
        SOP step 3: before recording an invoice, open the referenced PO's detail page
        (/purchase-orders/<PO number>), note its approved amount, and compare it with the invoice
        amount using calculate. Then fill the form again with the status that comparison dictates.

    - name: payment-approval-limit
      decision: approve
      label_regex: "(?i)save invoice"
      field_conditions:            # read live from the form on the current page
        - {field: status, equals: "Approved for payment"}
        - {field: amount, greater_than: 5000}
      reason: "Invoices over USD 5,000 need Finance Manager sign-off before approval for payment."

    - name: no-deletions
      decision: block
      label_regex: "(?i)\\b(delete|remove|purge)\\b"
      reason: "Deleting records is not permitted for the operator."

email:
  internal_domain: acme-corp.com
  external_requires_approval: true

files:
  # Paths are relative to the workspace root. Writes outside these prefixes are blocked.
  writable_prefixes: ["reports/", "outbox/", "scratch/"]

# Pause for a human after this many consecutive failed actions.
max_consecutive_failures: 4
